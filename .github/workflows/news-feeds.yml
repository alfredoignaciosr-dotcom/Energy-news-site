name: Update news feeds

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: news-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch feeds
        id: feeds
        run: |
          python3 scripts/fetch_feeds.py
          if git diff --quiet -- assets/data/feeds.json && [ -f assets/data/briefing.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch podcast episode artwork
        run: python3 scripts/fetch_podcast_art.py

      # Needs the ANTHROPIC_API_KEY repository secret; skipped quietly without it.
      - name: Write AI briefing
        if: steps.feeds.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then pip install --quiet anthropic; fi
          python3 scripts/make_briefing.py

      - name: Commit changes
        id: commit
        run: |
          git add assets/data/
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update news feeds"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits pushed with GITHUB_TOKEN may not start a Pages build on their own.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the next push will publish the update."
