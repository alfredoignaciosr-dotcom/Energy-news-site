name: Update news feeds

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: news-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch feeds
        run: python3 scripts/fetch_feeds.py

      - name: Fetch latest podcast episodes
        run: python3 scripts/fetch_podcasts.py

      - name: Commit changes
        id: commit
        run: |
          git add assets/data/
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update news feeds"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits pushed with GITHUB_TOKEN may not start a Pages build on their own.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the next push will publish the update."
